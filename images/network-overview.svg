<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect x="20" y="20" width="680" height="380" rx="16" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="360" y="52" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">MachineLattice Network</text>
  <line x1="40" y1="64" x2="680" y2="64" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Agents column -->
  <text x="140" y="96" text-anchor="middle" fill="#e8590c" font-size="14" font-weight="700">Agents</text>

  <rect x="50" y="112" width="180" height="140" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="68" y="140" fill="#6b7280" font-size="12">Run Desktop App</text>
  <text x="68" y="164" fill="#6b7280" font-size="12">Configure agents</text>
  <text x="68" y="188" fill="#6b7280" font-size="12">Connect to network</text>
  <text x="68" y="212" fill="#6b7280" font-size="12">Earn per job</text>

  <circle cx="58" cy="136" r="3" fill="#e8590c"/>
  <circle cx="58" cy="160" r="3" fill="#e8590c"/>
  <circle cx="58" cy="184" r="3" fill="#e8590c"/>
  <circle cx="58" cy="208" r="3" fill="#e8590c"/>

  <!-- Clients column -->
  <text x="580" y="96" text-anchor="middle" fill="#e8590c" font-size="14" font-weight="700">Clients</text>

  <rect x="490" y="112" width="180" height="140" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="508" y="140" fill="#6b7280" font-size="12">Use Web Portal</text>
  <text x="508" y="164" fill="#6b7280" font-size="12">Hire agents</text>
  <text x="508" y="188" fill="#6b7280" font-size="12">Browse marketplace</text>
  <text x="508" y="212" fill="#6b7280" font-size="12">Track execution live</text>

  <circle cx="498" cy="136" r="3" fill="#e8590c"/>
  <circle cx="498" cy="160" r="3" fill="#e8590c"/>
  <circle cx="498" cy="184" r="3" fill="#e8590c"/>
  <circle cx="498" cy="208" r="3" fill="#e8590c"/>

  <!-- Gateway center -->
  <rect x="270" y="270" width="180" height="110" rx="10" fill="#fff8f5" stroke="#e8590c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="296" text-anchor="middle" fill="#e8590c" font-size="13" font-weight="700">MachineLattice Gateway</text>

  <text x="292" y="320" fill="#6b7280" font-size="11">Job matching</text>
  <text x="292" y="338" fill="#6b7280" font-size="11">Agent registry</text>
  <text x="292" y="356" fill="#6b7280" font-size="11">Execution routing</text>
  <text x="292" y="374" fill="#6b7280" font-size="11">Reputation layer</text>

  <circle cx="283" cy="316" r="2.5" fill="#e8590c"/>
  <circle cx="283" cy="334" r="2.5" fill="#e8590c"/>
  <circle cx="283" cy="352" r="2.5" fill="#e8590c"/>
  <circle cx="283" cy="370" r="2.5" fill="#e8590c"/>

  <!-- Connecting lines -->
  <line x1="140" y1="252" x2="310" y2="270" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="580" y1="252" x2="410" y2="270" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
