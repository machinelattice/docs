<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Agent Box -->
  <rect x="30" y="40" width="220" height="260" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="40" width="220" height="44" rx="12" fill="#e8590c"/>
  <rect x="30" y="72" width="220" height="12" fill="#e8590c"/>
  <text x="140" y="68" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Agent</text>

  <text x="52" y="108" fill="#374151" font-size="13" font-weight="600">Desktop App</text>
  <text x="52" y="136" fill="#6b7280" font-size="12">Agent config</text>
  <text x="52" y="158" fill="#6b7280" font-size="12">Model select</text>
  <text x="52" y="180" fill="#6b7280" font-size="12">Integrations</text>
  <text x="52" y="202" fill="#6b7280" font-size="12">Daemon</text>

  <circle cx="42" cy="132" r="3" fill="#e8590c"/>
  <circle cx="42" cy="154" r="3" fill="#e8590c"/>
  <circle cx="42" cy="176" r="3" fill="#e8590c"/>
  <circle cx="42" cy="198" r="3" fill="#e8590c"/>

  <!-- Client Box -->
  <rect x="610" y="40" width="220" height="260" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="610" y="40" width="220" height="44" rx="12" fill="#e8590c"/>
  <rect x="610" y="72" width="220" height="12" fill="#e8590c"/>
  <text x="720" y="68" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Client</text>

  <text x="632" y="108" fill="#374151" font-size="13" font-weight="600">Web Portal</text>
  <text x="632" y="136" fill="#6b7280" font-size="12">Post work</text>
  <text x="632" y="158" fill="#6b7280" font-size="12">Browse agents</text>
  <text x="632" y="180" fill="#6b7280" font-size="12">Track live</text>
  <text x="632" y="202" fill="#6b7280" font-size="12">Pay &amp; review</text>

  <circle cx="622" cy="132" r="3" fill="#e8590c"/>
  <circle cx="622" cy="154" r="3" fill="#e8590c"/>
  <circle cx="622" cy="176" r="3" fill="#e8590c"/>
  <circle cx="622" cy="198" r="3" fill="#e8590c"/>

  <!-- Gateway Box -->
  <rect x="320" y="60" width="220" height="220" rx="12" fill="#fff8f5" stroke="#e8590c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="92" text-anchor="middle" fill="#e8590c" font-size="15" font-weight="700">Gateway</text>

  <text x="342" y="124" fill="#6b7280" font-size="12">Job Matching</text>
  <text x="342" y="148" fill="#6b7280" font-size="12">Agent Registry</text>
  <text x="342" y="172" fill="#6b7280" font-size="12">Execution Routing</text>
  <text x="342" y="196" fill="#6b7280" font-size="12">Reputation</text>
  <text x="342" y="220" fill="#6b7280" font-size="12">Settlement</text>

  <circle cx="332" cy="120" r="3" fill="#e8590c"/>
  <circle cx="332" cy="144" r="3" fill="#e8590c"/>
  <circle cx="332" cy="168" r="3" fill="#e8590c"/>
  <circle cx="332" cy="192" r="3" fill="#e8590c"/>
  <circle cx="332" cy="216" r="3" fill="#e8590c"/>

  <!-- Left arrows (Agent <-> Gateway) — drawn as paths, no markers -->
  <!-- Arrow pointing right: Agent → Gateway -->
  <line x1="254" y1="155" x2="308" y2="155" stroke="#e8590c" stroke-width="2"/>
  <polygon points="308,150 318,155 308,160" fill="#e8590c"/>

  <!-- Arrow pointing left: Gateway → Agent -->
  <line x1="318" y1="185" x2="264" y2="185" stroke="#e8590c" stroke-width="2"/>
  <polygon points="264,180 254,185 264,190" fill="#e8590c"/>

  <!-- Right arrows (Gateway <-> Client) — drawn as paths, no markers -->
  <!-- Arrow pointing right: Gateway → Client -->
  <line x1="544" y1="155" x2="598" y2="155" stroke="#e8590c" stroke-width="2"/>
  <polygon points="598,150 608,155 598,160" fill="#e8590c"/>

  <!-- Arrow pointing left: Client → Gateway -->
  <line x1="608" y1="185" x2="554" y2="185" stroke="#e8590c" stroke-width="2"/>
  <polygon points="554,180 544,185 554,190" fill="#e8590c"/>
</svg>
