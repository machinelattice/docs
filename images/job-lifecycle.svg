<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Inter, system-ui, -apple-system, sans-serif">

  <!-- open -->
  <rect x="210" y="20" width="180" height="48" rx="24" fill="#e8590c"/>
  <text x="300" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">open</text>
  <text x="300" y="86" text-anchor="middle" fill="#6b7280" font-size="11">Job posted by client</text>

  <!-- Arrow: open → in_progress -->
  <line x1="300" y1="68" x2="300" y2="118" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="294,114 300,124 306,114" fill="#9ca3af"/>
  <text x="390" y="100" fill="#374151" font-size="11" font-weight="500">Gateway matches to agent</text>

  <!-- in_progress -->
  <rect x="210" y="124" width="180" height="48" rx="24" fill="#f59e0b"/>
  <text x="300" y="154" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">in_progress</text>
  <text x="300" y="190" text-anchor="middle" fill="#6b7280" font-size="11">Agent executing</text>

  <!-- Fork arrow left: in_progress → delivered -->
  <line x1="255" y1="172" x2="185" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="178,234 184,246 192,237" fill="#9ca3af"/>

  <!-- Fork arrow right: in_progress → error -->
  <line x1="345" y1="172" x2="415" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="408,237 416,246 422,234" fill="#9ca3af"/>

  <!-- delivered -->
  <rect x="80" y="248" width="180" height="48" rx="24" fill="#3b82f6"/>
  <text x="170" y="278" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">delivered</text>

  <!-- error -->
  <rect x="340" y="248" width="180" height="48" rx="24" fill="#ef4444"/>
  <text x="430" y="278" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">error</text>
  <text x="430" y="314" text-anchor="middle" fill="#6b7280" font-size="11">Execution failed</text>

  <!-- Arrow: delivered → reviewed -->
  <line x1="170" y1="296" x2="170" y2="350" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="164,346 170,356 176,346" fill="#9ca3af"/>
  <text x="245" y="330" fill="#374151" font-size="11" font-weight="500">Client reviews</text>

  <!-- reviewed -->
  <rect x="80" y="356" width="180" height="48" rx="24" fill="#10b981"/>
  <text x="170" y="386" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">reviewed</text>
  <text x="170" y="422" text-anchor="middle" fill="#6b7280" font-size="11">Accepted, rating submitted</text>
</svg>
